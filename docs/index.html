<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrollToBid — Dev Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;
    --text:#e4e6f0;--text2:#9498b0;--text3:#636782;
    --blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);--blue-border:rgba(59,130,246,.25);
    --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);--amber-border:rgba(245,158,11,.25);
    --teal:#14b8a6;--teal-bg:rgba(20,184,166,.12);--teal-border:rgba(20,184,166,.25);
    --gray:#6b7280;--gray-bg:rgba(107,114,128,.12);--gray-border:rgba(107,114,128,.25);
    --green:#22c55e;--red:#ef4444;--purple:#a855f7;
    --radius:12px;--radius-sm:8px;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .header{position:sticky;top:0;z-index:100;background:rgba(15,17,23,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 24px}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .header h1 span{color:var(--blue)}
  .header p{font-size:13px;color:var(--text2);margin-top:2px}
  .header-user{font-size:13px;color:var(--teal);background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.25);padding:4px 12px;border-radius:20px}
  .progress-section{max-width:1200px;margin:20px auto 0;padding:0 24px}
  .progress-bar-outer{background:var(--surface);border-radius:20px;height:10px;overflow:hidden;border:1px solid var(--border)}
  .progress-bar-inner{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s ease}
  .progress-stats{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--text2)}
  .progress-stats strong{color:var(--text);font-size:22px;font-weight:700}
  .filters{max-width:1200px;margin:16px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
  .filter-btn:hover{border-color:var(--text3);color:var(--text)}
  .filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .filter-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .sections{max-width:1200px;margin:20px auto;padding:0 24px 60px}
  .section{margin-bottom:24px}
  .section-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer;user-select:none}
  .section-header:hover .section-title{color:var(--blue)}
  .section-badge{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 10px;font-size:12px;font-weight:700;color:var(--text2);min-width:36px;text-align:center}
  .section-title{font-size:16px;font-weight:700;transition:color .2s}
  .section-count{font-size:12px;color:var(--text3);margin-left:auto}
  .section-chevron{color:var(--text3);font-size:16px;transition:transform .2s}
  .section.collapsed .section-chevron{transform:rotate(-90deg)}
  .section.collapsed .section-body{display:none}
  .section-progress{width:60px;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-left:8px}
  .section-progress-inner{height:100%;background:var(--teal);border-radius:2px;transition:width .3s}
  .subsection{margin-bottom:16px}
  .subsection-title{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:8px 0 8px 2px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .feat{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);transition:background .15s;border:1px solid transparent}
  .feat:hover{background:var(--surface2);border-color:var(--border)}
  .feat-status{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s;margin-top:1px}
  .feat-status.s-not-started{border-color:var(--text3);background:transparent}
  .feat-status.s-in-progress{border-color:var(--blue);background:var(--blue);color:#fff}
  .feat-status.s-done{border-color:var(--green);background:var(--green);color:#fff}
  .feat-info{flex:1;min-width:0}
  .feat-name{font-size:13px;font-weight:500;color:var(--text)}
  .feat-name.done{text-decoration:line-through;opacity:.5}
  .feat-desc{font-size:12px;color:var(--text3);margin-top:2px;display:none}
  .feat:hover .feat-desc{display:block}
  .feat-phase{flex-shrink:0;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;margin-top:2px}
  .phase-mvp{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
  .phase-2{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .phase-3{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
  .feat-comment-btn{flex-shrink:0;font-size:11px;color:var(--text3);cursor:pointer;opacity:0;transition:opacity .15s;margin-top:3px}
  .feat:hover .feat-comment-btn{opacity:1}
  .feat-comment-btn:hover{color:var(--purple)}
  .feat-comments{margin:6px 0 0 32px}
  .fc-item{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
  .fc-item.type-suggestion{border-left:3px solid var(--purple)}
  .fc-meta{display:flex;justify-content:space-between;margin-bottom:3px}
  .fc-author{font-weight:600;color:var(--teal);font-size:11px}
  .fc-time{color:var(--text3);font-size:10px}
  .fc-body{color:var(--text2)}
  .fc-type{font-size:9px;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:600}
  .fc-type.t-comment{background:var(--surface);color:var(--text3);border:1px solid var(--border)}
  .fc-type.t-suggestion{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.25)}
  .fc-delete{font-size:10px;color:var(--text3);cursor:pointer;margin-left:6px}
  .fc-delete:hover{color:var(--red)}
  .fc-form{display:flex;gap:6px;margin-top:4px}
  .fc-input{flex:1;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;outline:none;font-family:inherit}
  .fc-input:focus{border-color:var(--blue)}
  .fc-toggle{display:flex;gap:4px;margin-bottom:4px}
  .fc-toggle-btn{padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text3);font-size:11px;cursor:pointer}
  .fc-toggle-btn.act-c{background:var(--surface2);color:var(--text2);border-color:var(--text3)}
  .fc-toggle-btn.act-s{background:rgba(168,85,247,.12);color:var(--purple);border-color:rgba(168,85,247,.25)}
  .fc-send{padding:6px 12px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
  .fc-count{font-size:10px;color:var(--purple);margin-left:4px}
  .login-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 36px;width:100%;max-width:380px;text-align:center}
  .login-box h1{font-size:24px;font-weight:700;margin-bottom:4px}
  .login-box h1 span{color:var(--blue)}
  .login-box p{font-size:13px;color:var(--text2);margin-bottom:20px}
  .login-box input{width:100%;padding:12px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
  .login-box input:focus{border-color:var(--blue)}
  .login-box input::placeholder{color:var(--text3)}
  .login-box button{width:100%;margin-top:14px;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .login-box label{display:block;text-align:left;font-size:13px;color:var(--text2);margin:16px 0 6px}
  .login-error{color:var(--red);font-size:13px;margin-top:12px;display:none}
  .app-content{display:none}
  .search-bar{max-width:1200px;margin:16px auto 0;padding:0 24px}
  .search-input{width:100%;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none}
  .search-input:focus{border-color:var(--blue)}
  .search-input::placeholder{color:var(--text3)}
  @media(max-width:600px){
    .header{padding:12px 16px}
    .header-inner{flex-direction:column;align-items:flex-start;gap:4px}
    .sections,.filters,.progress-section,.search-bar{padding-left:16px;padding-right:16px}
    .feat{padding:8px 6px}
    .section-progress{display:none}
  }
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>Scroll<span>ToBid</span></h1>
    <p>Dev Tracker — 462 features across 11 sections</p>
    <input type="password" id="passInput" placeholder="Access code" autocomplete="off">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Nikolas" autocomplete="off">
    <button onclick="tryLogin()">Enter</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div class="app-content" id="appContent">
<div class="header"><div class="header-inner"><div><h1>Scroll<span>ToBid</span> — Dev Tracker</h1><p>462 features &middot; 11 sections &middot; React Native + Supabase</p></div><div class="header-user" id="headerUser"></div></div></div>
<div class="progress-section"><div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div><div class="progress-stats"><span><strong id="progressPct">0%</strong> complete</span><span id="progressCount">0 / 462 done</span></div></div>
<div class="search-bar"><input class="search-input" id="searchInput" placeholder="Search 462 features..." oninput="render()"></div>
<div class="filters" id="filters"><span class="filter-label">Phase:</span><button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter="Phase 1 (MVP)">MVP</button><button class="filter-btn" data-filter="Phase 2">Phase 2</button><button class="filter-btn" data-filter="Phase 3">Phase 3</button></div>
<div class="sections" id="sections"></div>
</div>

async function sb(p,o){o=o||{};var r=await fetch(SB_URL+"/rest/v1/"+p,Object.assign({headers:SB_H},o));if(!r.ok)throw new Error(await r.text());var t=await r.text();return t?JSON.parse(t):null}
var allComments=[];
async function loadComments(){try{allComments=await sb("tracker_comments?order=created_at.asc")}catch(e){allComments=[]}}
function commFor(id){return allComments.filter(function(c){return c.task_id===id})}
async function postComm(id,body,type){var r=await sb("tracker_comments",{method:"POST",body:JSON.stringify({task_id:id,author:currentUser,body:body,type:type})});if(Array.isArray(r))allComments=allComments.concat(r);else if(r)allComments.push(r);render()}
async function delComm(id){await sb("tracker_comments?id=eq."+id,{method:"DELETE"});allComments=allComments.filter(function(c){return c.id!==id});render()}
function setupRT(){try{var ws=new WebSocket(SB_URL.replace("https://","wss://")+"/realtime/v1/websocket?apikey="+SB_KEY+"&vsn=1.0.0");ws.onopen=function(){ws.send(JSON.stringify({topic:"realtime:public:tracker_comments",event:"phx_join",payload:{config:{broadcast:{self:false},postgres_changes:[{event:"*",schema:"public",table:"tracker_comments"}]}},ref:"1"}));setInterval(function(){ws.send(JSON.stringify({topic:"phoenix",event:"heartbeat",payload:{},ref:"hb"}))},30000)};ws.onmessage=function(m){try{var d=JSON.parse(m.data);if(d.event==="postgres_changes")loadComments().then(render)}catch(e){}};ws.onclose=function(){setTimeout(setupRT,5000)}}catch(e){}}

 (MVP)"},{"name":"Shipping cost","desc":"Displayed before you bid. No surprises","phase":"Phase 1 (MVP)"},{"name":"Authentication badge","desc":"If item has been verified (checkmark icon)","phase":"Phase 1 (MVP)"},{"name":"\"Watching\" count","desc":"How many people have this on their watchlist","phase":"Phase 1 (MVP)"},{"name":"Social proof banner","desc":"\"4 of your friends are watching this auction\"","phase":"Phase 1 (MVP)"},{"name":"Likes and comments as the bidding is happening.","desc":"Likes and comments as the bidding is happening.","phase":"Phase 1 (MVP)"}],"Actions you can take on each card":[{"name":"Tap to bid","desc":"One-tap default bid or long-press for custom amount","phase":"Phase 1 (MVP)"},{"name":"Set max bid (proxy)","desc":"Enter your maximum. System auto-bids incrementally for you","phase":"Phase 1 (MVP)"},{"name":"Swipe up","desc":"Skip to next auction","phase":"Phase 1 (MVP)"},{"name":"Swipe down","desc":"Go back to previous auction","phase":"Phase 1 (MVP)"},{"name":"Tap heart / save","desc":"Add to watchlist. Get notified on price changes and ending soon","phase":"Phase 1 (MVP)"},{"name":"Tap share","desc":"Share auction to Instagram, TikTok, Twitter/X, iMessage, WhatsApp. Deep link opens directly in app","phase":"Phase 1 (MVP)"},{"name":"Tap seller profile","desc":"Opens seller\u2019s page with their other listings, ratings, history","phase":"Phase 1 (MVP)"},{"name":"Tap item photo","desc":"Expands to full gallery view with zoom and 360\u00b0 view","phase":"Phase 1 (MVP)"},{"name":"Flag listing","desc":"Report as suspicious, counterfeit, or mislabeled. 3+ flags = auto-review","phase":"Phase 1 (MVP)"},{"name":"\"Remind me\"","desc":"For \"coming soon\" cards \u2014 sets push notification for when auction starts","phase":"Phase 1 (MVP)"},{"name":"Comment/react","desc":"Live reactions on the auction card (fire, heart, skull, eyes)","phase":"Phase 1 (MVP)"}],"Payment options (when you win)":[{"name":"Credit/debit card","desc":"Stored on file f feed is deliberately outside your profile (discovery injection)","desc":"10\u201315% of feed is deliberately outside your profile (discovery injection)","phase":"Phase 1 (MVP)"},{"name":"Time-of-day optimization: quick flash auctions at lunch, premium items in the ev","desc":"Time-of-day optimization: quick flash auctions at lunch, premium items in the evening","phase":"Phase 1 (MVP)"},{"name":"New user first session: prioritizes most active, most affordable, most visually","desc":"New user first session: prioritizes most active, most affordable, most visually appealing auctions","phase":"Phase 1 (MVP)"},{"name":"Social signals: items your friends are watching or bidding on get boosted","desc":"Social signals: items your friends are watching or bidding on get boosted","phase":"Phase 1 (MVP)"}]}},{"name":"Tab2-Search","subsections":{"Search bar (top)":[{"name":"Text search","desc":"Type item name, seller, brand, model, SKU. Autocomplete suggestions","phase":"Phase 1 (MVP)"},{"name":"Voice search","desc":"Tap mic icon, say what you\u2019re looking for","phase":"Phase 1 (MVP)"},{"name":"Image search (Phase 2)","desc":"Take a photo or upload \u2014 AI finds matching listings","phase":"Phase 2"},{"name":"Barcode/UPC scan","desc":"Scan item barcode to find exact match on platform","phase":"Phase 1 (MVP)"},{"name":"Recent searches","desc":"Quick access to your search history","phase":"Phase 1 (MVP)"},{"name":"Saved searches","desc":"Save a search and get notified when new matching items are listed","phase":"Phase 1 (MVP)"}],"Search-to-feed experience (TikTok-style search behavior)":[{"name":"Step 1: User taps search bar","desc":"prominent at top of home feed and explore tab. Types what they want: \u201cJordan 4 Retro,\u201d \u201cvintage band tees,\u201d \u201cAirPods Pro\u201d","phase":"Phase 1 (MVP)"},{"name":"Step 2: Gallery grid results","desc":"results appear as a visual thumbnail grid (like TikTok search results). Each tile shows: item photo, current bid, time remaining, number of bidders. User can scan dozens of results at a glance","phase":"Phase 1 (MVP)"},{"name":"Step 3: Tap to enter full auction view","desc":"tapping any thumbnail opens the full-screen auction card. Same countdown timer, same bid button, same one-tap bidding, same real-time updates. Identical experience to the main feed","phase":"Phase 1 (MVP)"},{"name":"Step 4: Swipe stays in search category","desc":"this is the key difference. Swiping up does NOT return to the general feed. The next card is the next matching result from your search. Swipe again, another matching item. The scroll is locked to your search results. You are now in a dedicated \u201cvintage band tees\u201d auction feed","phase":"Phase 1 (MVP)"},{"name":"Step 5: End of search results","desc":"when search results run out, show: \u201cSet alert\u201d button (\u201cNotify me when new vintage band tees are listed\u201d), near-match suggestions (\u201cNo more vintage band tees \u2014 here are vintage graphic tees and vintage denim\u201d), and a \u201cBack to main feed\u201d button to return to the general scroll","phase":"Phase 1 (MVP)"},{"name":"Grid layout","desc":"2-column or 3-column thumbnail grid. Each tile shows item photo, current bid price, countdown timer badge, and bidder count. Visually dense so user can scan many options fast","phase":"Phase 1 (MVP)"},{"name":"Sort options within results","desc":"ending soonest, most bids, lowest price, just listed, best deal (lowest % of market value)","phase":"Phase 1 (MVP)"},{"name":"Filter pills on results","desc":"narrow within search: price range, condition, size, auction type, ending within X minutes","phase":"Phase 1 (MVP)"},{"name":"Live updating","desc":"gallery tiles update in real time. Bid prices change, timers count down, tiles disappear when auctions end and new matching auctions slide in","phase":"Phase 1 (MVP)"},{"name":"Quick-bid from grid","desc":"long-press a tile to place a quick bid without entering full-screen view. For power users who want to bid on multiple items fast","phase":"Phase 1 (MVP)"},{"name":"Result count","desc":"shows \u201c23 live auctions for vintage band tees\u201d at top. User knows exactly how much inventory is available","phase":"Phase 1 (MVP)"},{"name":"Every search logged","desc":"user ID, timestamp, query, whether results were found, whether user bid on any result. Builds a real-time demand map","phase":"Phase 1 (MVP)"},{"name":"Zero-result searches","desc":"the most valuable data point. Shows exactly what users want that the platform doesn\u2019t have. Team sources and lists matching items within 24-48 hours","phase":"Phase 1 (MVP)"},{"name":"Search feeds the algorithm","desc":"search queries teach the recommendation engine what each user wants. Someone who searches \u201cvintage watches\u201d 3 times starts seeing more vintage watches in their main feed at lower price points, even without searching again","phase":"Phase 1 (MVP)"},{"name":"Seller prompts from search data","desc":"at scale, search data generates AI demand cards: \u201c12 people searched for AirPods Pro this week. Be the first to list.\u201d Turns buyer intent into seller action","phase":"Phase 1 (MVP)"},{"name":"Set alert on any search","desc":"\u201cNotify me when Jordan 4 Retro size 11 is listed under $100.\u201d Push notification fires the moment a matching item goes live. User jumps straight into the auction. Works like a stock price alert for goods","phase":"Phase 1 (MVP)"},{"name":"Also when we don\u2019t have something that they search we will notify them regardles","desc":"Also when we don\u2019t have something that they search we will notify them regardless when we do have what they search and overall we will notify if we think something they are interested in is selling","phase":"Phase 1 (MVP)"}],"Browse categories":[{"name":"Category grid","desc":"Visual tiles: Sneakers, Streetwear, Electronics, Vintage, Collectibles, Home, Luxury, Art, Experiences, Sports, Automotive, Digital and more. C ings from a previous listing to reuse","phase":"Phase 1 (MVP)"},{"name":"Batch listing","desc":"List multiple items at once with shared settings","phase":"Phase 1 (MVP)"},{"name":"Inventory manager","desc":"See all your active, scheduled, ended, and draft listings","phase":"Phase 1 (MVP)"},{"name":"Seller analytics","desc":"Revenue, sell-through rate, average bids, best times, buyer demographics","phase":"Phase 1 (MVP)"},{"name":"Pricing intelligence","desc":"How your prices compare to market averages","phase":"Phase 1 (MVP)"},{"name":"Livestream selling","desc":"Go live while your auction runs. Narrate, show the item, interact with bidders","phase":"Phase 1 (MVP)"},{"name":"Creator drop tools","desc":"Schedule an event, create a branded auction room, invite followers","phase":"Phase 1 (MVP)"}],"Livestream auction selling (full feature detail)":[{"name":"Go Live button","desc":"accessible from the Sell tab and from any active listing. Tap to start broadcasting from your phone camera","phase":"Phase 1 (MVP)"},{"name":"Pre-stream setup","desc":"add a title, select category, queue up items to auction during the stream, set scheduled start time or go live immediately","phase":"Phase 1 (MVP)"},{"name":"Auction queue","desc":"pre-load 5, 10, 20+ items. Drag to reorder. When one auction ends, tap to launch next. Viewers see what is coming up","phase":"Phase 1 (MVP)"},{"name":"Notify followers","desc":"all followers get push notification when you go live. Scheduled streams send reminder 15 minutes before","phase":"Phase 1 (MVP)"},{"name":"Camera controls","desc":"flip camera, flashlight, mute mic, beauty filter, landscape/portrait mode","phase":"Phase 1 (MVP)"},{"name":"Show item on camera","desc":"hold it up, show details, flip it around, point out condition. Seeing it live builds more trust than photos","phase":"Phase 1 (MVP)"},{"name":"Launch auction button","desc":"tap to start 60-second countdown on current item. Auction card overlays on livestream for all viewers. Bidding happens in real time while you narrate","phase":"Phase 1 (MVP)"},{"name":"Live bid feed","desc":"see every bid as it comes in. Call out bidders by name to create energy and competition","phase":"Phase 1 (MVP)"},{"name":"Live chat","desc":"scrolling text chat. Viewers ask questions, react, hype each other. Seller can pin important messages","phase":"Phase 1 (MVP)"},{"name":"Viewer count and stream stats","desc":"live viewer count visible to all. Seller also sees: items sold, total revenue, average price, peak viewers (seller-only overlay)","phase":"Phase 1 (MVP)"},{"name":"Next item preview","desc":"viewers see thumbnail of next item in queue so they stay for what is coming","phase":"Phase 1 (MVP)"},{"name":"Discover in feed","desc":"livestreams appear as cards in the main feed with a LIVE badge, viewer count, and current item. Tap to join","phase":"Phase 1 (MVP)"},{"name":"Split screen layout","desc":"top: seller live video. Bottom: auction card with bid button, countdown, and chat. Bid without leaving the stream","phase":"Phase 1 (MVP)"},{"name":"One-tap bidding","desc":"same bid button as regular auctions. Real-time updates while seller hypes the item on camera","phase":"Phase 1 (MVP)"},{"name":"Chat, reactions, and tips","desc":"type messages, send quick reactions (fire, heart, skull), tip the seller with platform currency","phase":"Phase 1 (MVP)"},{"name":"Queue preview and share","desc":"see upcoming items as thumbnails. Share livestream link to social media with one tap. Follow seller for future notifications","phase":"Phase 1 (MVP)"},{"name":"Stream summary","desc":"total items sold, revenue, average price, peak viewers, unique viewers, new followers, tips received","phase":"Phase 1 (MVP)"},{"name":"Replay saved","desc":"full replay on seller profile. Unsold items auto-relist as regular auctions","phase":"Phase 1 (MVP)"},{"name":"Auto highlight clips","desc":"auto-generated short clips of best moments (highest bids, last-second snipes). One-tap share to iews and decides. Buyer-friendly default","phase":"Phase 1 (MVP)"},{"name":"Resolution options","desc":"Full refund, partial refund, return for refund, case closed","phase":"Phase 1 (MVP)"}],"Help and support":[{"name":"FAQ / knowledge base","desc":"Searchable help articles","phase":"Phase 1 (MVP)"},{"name":"Live chat support","desc":"In-app messaging with support team","phase":"Phase 1 (MVP)"},{"name":"Email support","desc":"For complex issues","phase":"Phase 1 (MVP)"},{"name":"Community guidelines","desc":"Rules of the platform. What\u2019s allowed, what\u2019s not","phase":"Phase 1 (MVP)"},{"name":"Prohibited items list","desc":"No weapons, drugs, counterfeits, stolen goods, hazardous materials","phase":"Phase 1 (MVP)"}],"Verification center":[{"name":"Phone verification","desc":"SMS code. Required for all accounts","phase":"Phase 1 (MVP)"},{"name":"Email verification","desc":"Confirmation link. Required for all accounts","phase":"Phase 1 (MVP)"},{"name":"ID verification","desc":"Upload government ID. Required before first listing. Via Stripe Identity","phase":"Phase 1 (MVP)"},{"name":"Bank account linking","desc":"Required for seller payouts. Managed by Stripe Connect","phase":"Phase 1 (MVP)"},{"name":"Business verification","desc":"For high-volume sellers. Additional documentation","phase":"Phase 1 (MVP)"},{"name":"Authentication request","desc":"Request physical authentication for a specific item you\u2019re selling","phase":"Phase 1 (MVP)"}],"Referral program":[{"name":"Your unique code / link","desc":"Share anywhere","phase":"Phase 1 (MVP)"},{"name":"Referral tracker","desc":"How many people signed up, completed first purchase","phase":"Phase 1 (MVP)"},{"name":"Rewards","desc":"Both parties get platform credit on first completed transaction","phase":"Phase 1 (MVP)"},{"name":"Leaderboard","desc":"Top referrers get bonus rewards","phase":"Phase 1 (MVP)"}],"Admin tools (not user-facing, but built)":[{"name":"Content moderation","desc":"Review flagged listings, approve/reject","phase":"Phase 1 (MVP)"},{"name":"Dispute resolution dashboard","desc":"All open disputes, evidence, resolution tools","phase":"Phase 1 (MVP)"},{"name":"User management","desc":"Suspend, ban, adjust trust tiers","phase":"Phase 1 (MVP)"},{"name":"Feed health monitor","desc":"Live auction count, bids per auction, category depth, scroll velocity","phase":"Phase 1 (MVP)"},{"name":"Financial reporting","desc":"GMV, revenue, payouts, disputes, fraud losses","phase":"Phase 1 (MVP)"},{"name":"Seller approval queue","desc":"Manual review of early seller applications","phase":"Phase 1 (MVP)"},{"name":"Analytics dashboard","desc":"Retention, engagement, conversion, cohort analysis","phase":"Phase 1 (MVP)"}]}}];

function fid(secName,featName){return (secName+"__"+featName).replace(/[^a-zA-Z0-9]/g,"_").substring(0,80)}
function loadSt(){try{return JSON.parse(localStorage.getItem("stb-st2"))||{}}catch(e){return{}}}
function saveSt(s){localStorage.setItem("stb-st2",JSON.stringify(s))}
var statuses=loadSt();
var ST_CY=["not-started","in-progress","done"];
var ST_IC={"not-started":"","in-progress":"\u2014","done":"\u2713"};
function getSt(id){return statuses[id]||"not-started"}
function cycleSt(id,e){e.stopPropagation();var c=getSt(id);statuses[id]=ST_CY[(ST_CY.indexOf(c)+1)%3];saveSt(statuses);render()}
var activePhase="all";
var openComments={};
var commTypes={};
var collapsedSections={};
function timeAgo(d){var s=Math.floor((new Date()-new Date(d))/1000);if(s<60)return"now";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function phaseClass(p){if(p.indexOf("2")!==-1)return"phase-2";if(p.indexOf("3")!==-1)return"phase-3";return"phase-mvp"}

function render(){
  var q=(document.getElementById("searchInput")||{}).value||"";
  var ql=q.toLowerCase();
  var cont=document.getElementById("sections");
  cont.innerHTML="";
  var total=0,done=0;

  DATA.forEach(function(sec,si){
    var secFeats=0,secDone=0,secHtml="";
    var subs=Object.entries(sec.subsections);
    subs.forEach(function(entry){
      var subName=entry[0],feats=entry[1];
      var fHtml="";
      feats.forEach(function(f){
        if(activePhase!=="all"&&f.phase!==activePhase)return;
        if(ql&&f.name.toLowerCase().indexOf(ql)===-1&&f.desc.toLowerCase().indexOf(ql)===-1&&subName.toLowerCase().indexOf(ql)===-1)return;
        var id=fid(sec.name,f.name);
        var st=getSt(id);
        total++;secFeats++;
        if(st==="done"){done++;secDone++}
        var comms=commFor(id);
        var cOpen=openComments[id];
        var cType=commTypes[id]||"comment";

        var ccHtml="";
        if(comms.length){
          comms.forEach(function(c){
            ccHtml+="<div class=\"fc-item "+(c.type==="suggestion"?"type-suggestion":"")+"\">";
            ccHtml+="<div class=\"fc-meta\"><div><span class=\"fc-author\">"+esc(c.author)+"</span>";
            ccHtml+="<span class=\"fc-type t-"+c.type+"\">"+(c.type==="suggestion"?"Suggest":"Note")+"</span>";
            if(c.author===currentUser)ccHtml+="<span class=\"fc-delete\" onclick=\"delComm('"+c.id+"')\">×</span>";
            ccHtml+="</div><span class=\"fc-time\">"+timeAgo(c.created_at)+"</span></div>";
            ccHtml+="<div class=\"fc-body\">"+esc(c.body)+"</div></div>";
          });
        }else{
          ccHtml="<div style=\"font-size:11px;color:var(--text3);margin-bottom:4px\">No comments yet</div>";
        }

        fHtml+="<div class=\"feat\">";
        fHtml+="<div class=\"feat-status s-"+st+"\" onclick=\"cycleSt('"+id+"',event)\" title=\"Click to change\">"+ST_IC[st]+"</div>";
        fHtml+="<div class=\"feat-info\"><div class=\"feat-name "+(st==="done"?"done":"")+"\">"+esc(f.name)+"</div>";
        fHtml+="<div class=\"feat-desc\">"+esc(f.desc)+"</div></div>";
        fHtml+="<span class=\"feat-phase "+phaseClass(f.phase)+"\">"+f.phase.replace("Phase 1 (MVP)","MVP")+"</span>";
        if(comms.length)fHtml+="<span class=\"fc-count\">"+comms.length+"</span>";
        fHtml+="<span class=\"feat-comment-btn\" onclick=\"toggleComm('"+id+"')\">💬</span>";
        fHtml+="</div>";

        if(cOpen){
          fHtml+="<div class=\"feat-comments\" style=\"display:block;margin:6px 0 0 32px\">";
          fHtml+=ccHtml;
          fHtml+="<div class=\"fc-toggle\">";
          fHtml+="<button class=\"fc-toggle-btn "+(cType==="comment"?"act-c":"")+"\" onclick=\"setCommType('"+id+"','comment')\">Comment</button>";
          fHtml+="<button class=\"fc-toggle-btn "+(cType==="suggestion"?"act-s":"")+"\" onclick=\"setCommType('"+id+"','suggestion')\">Suggestion</button>";
          fHtml+="</div>";
          fHtml+="<div class=\"fc-form\"><input class=\"fc-input\" id=\"ci-"+id+"\" placeholder=\"Write a "+cType+"...\" onkeydown=\"if(event.key==='Enter')sendComm('"+id+"')\"><button class=\"fc-send\" onclick=\"sendComm('"+id+"')\">Send</button></div>";
          fHtml+="</div>";
        }
      });
      if(fHtml)secHtml+="<div class=\"subsection\"><div class=\"subsection-title\">"+esc(subName)+"</div>"+fHtml+"</div>";
    });
    if(!secHtml)return;
    var collapsed=collapsedSections[si];
    var secPct=secFeats?Math.round(secDone/secFeats*100):0;
    cont.innerHTML+="<div class=\"section"+(collapsed?" collapsed":"")+"\">"
      +"<div class=\"section-header\" onclick=\"toggleSec("+si+")\">"
      +"<span class=\"section-badge\">"+(si+1)+"</span>"
      +"<span class=\"section-title\">"+esc(sec.name)+"</span>"
      +"<div class=\"section-progress\"><div class=\"section-progress-inner\" style=\"width:"+secPct+"%\"></div></div>"
      +"<span class=\"section-count\">"+secDone+"/"+secFeats+"</span>"
      +"<span class=\"section-chevron\">▾</span></div>"
      +"<div class=\"section-body\">"+secHtml+"</div></div>";
  });

  var pct=total?Math.round(done/total*100):0;
  document.getElementById("progressBar").style.width=pct+"%";
  document.getElementById("progressPct").textContent=pct+"%";
  document.getElementById("progressCount").textContent=done+" / "+total+" done";
}

function toggleSec(i){collapsedSections[i]=!collapsedSections[i];render()}
function toggleComm(id){openComments[id]=!openComments[id];render()}
function setCommType(id,t){commTypes[id]=t;render()}
async function sendComm(id){var inp=document.getElementById("ci-"+id);if(!inp||!inp.value.trim())return;await postComm(id,inp.value.trim(),commTypes[id]||"comment")}
document.getElementById("filters").addEventListener("click",function(e){if(!e.target.classList.contains("filter-btn"))return;document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active")});e.target.classList.add("active");activePhase=e.target.dataset.filter;render()});
</script>
</body>
</html>
