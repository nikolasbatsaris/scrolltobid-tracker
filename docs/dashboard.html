<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ScrollToBid — Control Panel</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;
    --text:#e4e6f0;--text2:#9498b0;--text3:#636782;
    --blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);--blue-border:rgba(59,130,246,.25);
    --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);--amber-border:rgba(245,158,11,.25);
    --teal:#14b8a6;--teal-bg:rgba(20,184,166,.12);--teal-border:rgba(20,184,166,.25);
    --gray:#6b7280;--gray-bg:rgba(107,114,128,.12);--gray-border:rgba(107,114,128,.25);
    --green:#22c55e;--green-bg:rgba(34,197,94,.12);--green-border:rgba(34,197,94,.3);
    --red:#ef4444;--red-bg:rgba(239,68,68,.12);--red-border:rgba(239,68,68,.3);
    --purple:#a855f7;
    --radius:12px;--radius-sm:8px;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
  a{color:var(--blue);text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  /* Login */
  .login-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px 28px;width:100%;max-width:360px;text-align:center}
  .login-box h1{font-size:22px;font-weight:700;margin-bottom:4px}
  .login-box h1 span{color:var(--blue)}
  .login-box p{font-size:13px;color:var(--text2);margin-bottom:20px}
  .login-box input{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;outline:none;transition:border-color .2s;margin-bottom:10px}
  .login-box input:focus{border-color:var(--blue)}
  .login-box input::placeholder{color:var(--text3)}
  .login-box button{width:100%;padding:13px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:4px}
  .login-box button:hover{opacity:.9}
  .login-box label{display:block;text-align:left;font-size:13px;color:var(--text2);margin-bottom:6px}
  .login-error{color:var(--red);font-size:13px;margin-top:12px;display:none}
  .app-content{display:none}

  /* Header */
  .header{position:sticky;top:0;z-index:100;background:rgba(15,17,23,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 16px}
  .header-inner{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .header-left{display:flex;align-items:center;gap:10px}
  .back-link{font-size:13px;color:var(--text3);border:1px solid var(--border);background:var(--surface2);padding:5px 11px;border-radius:20px;white-space:nowrap}
  .back-link:hover{color:var(--text);border-color:var(--text3)}
  .header-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
  .header-title span{color:var(--blue)}
  .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .sound-btn{font-size:18px;background:none;border:none;padding:4px 6px;border-radius:8px;transition:opacity .2s;line-height:1}
  .sound-btn:hover{opacity:.7}
  .logout-btn{font-size:12px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:5px 11px;border-radius:20px;white-space:nowrap}
  .logout-btn:hover{color:var(--red);border-color:var(--red)}

  /* Main layout */
  .main{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:700px;margin:0 auto;padding-bottom:40px}

  /* Section */
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
  .section-header-left{display:flex;align-items:center;gap:8px}
  .section-title{font-size:15px;font-weight:700}
  .badge-count{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;min-width:20px;text-align:center}
  .badge-count.urgent{background:var(--red);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .section-body{padding:14px 16px}
  .section-body.empty{color:var(--text3);font-size:13px;text-align:center;padding:20px 16px}

  /* Collapse toggle */
  .collapse-btn{background:none;border:none;color:var(--text3);font-size:18px;padding:0;line-height:1;transition:transform .2s}
  .collapsed .collapse-btn{transform:rotate(-90deg)}
  .collapsed .section-body{display:none}

  /* Alert cards */
  .alert-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;transition:box-shadow .3s}
  .alert-card:last-child{margin-bottom:0}
  .alert-card.unread-manager{box-shadow:0 0 0 2px rgba(59,130,246,.4),0 0 12px rgba(59,130,246,.2)}
  .alert-card.unread-developer{box-shadow:0 0 0 2px rgba(245,158,11,.4),0 0 12px rgba(245,158,11,.2)}
  .alert-card.unread-tester{box-shadow:0 0 0 2px rgba(20,184,166,.4),0 0 12px rgba(20,184,166,.2)}
  .alert-card.unread-all{box-shadow:0 0 0 2px rgba(168,85,247,.4),0 0 12px rgba(168,85,247,.2)}
  .alert-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .alert-agent{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px}
  .alert-agent.agent-manager{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
  .alert-agent.agent-developer{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .alert-agent.agent-tester{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-border)}
  .alert-agent.agent-all{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.25)}
  .alert-time{font-size:11px;color:var(--text3)}
  .alert-msg{font-size:13px;color:var(--text2);line-height:1.5}
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;flex-shrink:0}
  .mark-all-btn{font-size:12px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
  .mark-all-btn:hover{color:var(--text);border-color:var(--text3)}

  /* Approval cards */
  .approval-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
  .approval-card:last-child{margin-bottom:0}
  .approval-question{font-size:14px;color:var(--text);font-weight:500;margin-bottom:10px;line-height:1.5}
  .approval-meta{font-size:11px;color:var(--text3);margin-bottom:10px}
  .approval-note{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:none;min-height:60px;margin-bottom:10px}
  .approval-note:focus{border-color:var(--amber)}
  .approval-note::placeholder{color:var(--text3)}
  .approval-actions{display:flex;gap:10px}
  .approve-btn{flex:1;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;font-size:14px;font-weight:700;transition:opacity .2s}
  .approve-btn:hover{opacity:.85}
  .reject-btn{flex:1;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--red);color:#fff;font-size:14px;font-weight:700;transition:opacity .2s}
  .reject-btn:hover{opacity:.85}
  .approval-btn:disabled{opacity:.5;cursor:default}

  /* History */
  .history-toggle{width:100%;background:none;border:none;color:var(--text3);font-size:12px;padding:10px 0 0;text-align:left;display:flex;align-items:center;gap:6px}
  .history-toggle:hover{color:var(--text2)}
  .history-toggle .chevron-sm{font-size:14px;transition:transform .2s}
  .history-open .chevron-sm{transform:rotate(90deg)}
  .history-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .history-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
  .history-card.status-approved{border-left:3px solid var(--green)}
  .history-card.status-rejected{border-left:3px solid var(--red)}
  .history-question{font-size:12px;color:var(--text2);margin-bottom:4px}
  .history-status{font-size:11px;font-weight:600}
  .history-status.approved{color:var(--green)}
  .history-status.rejected{color:var(--red)}
  .history-note{font-size:11px;color:var(--text3);margin-top:3px}

  /* Command section */
  .cmd-form{display:flex;flex-direction:column;gap:10px}
  .cmd-row{display:flex;gap:8px}
  .cmd-input{flex:1;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit;outline:none}
  .cmd-input:focus{border-color:var(--blue)}
  .cmd-input::placeholder{color:var(--text3)}
  .cmd-select{padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;outline:none;-webkit-appearance:none;min-width:110px}
  .cmd-select:focus{border-color:var(--blue)}
  .cmd-send{padding:11px 18px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;white-space:nowrap;transition:opacity .2s}
  .cmd-send:hover{opacity:.9}
  .cmd-send:disabled{opacity:.5;cursor:default}
  .cmd-recent{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .cmd-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cmd-item-text{font-size:13px;color:var(--text2);flex:1}
  .cmd-item-meta{font-size:11px;color:var(--text3);text-align:right;white-space:nowrap}
  .cmd-item-target{font-size:11px;font-weight:600;margin-bottom:2px}
  .cmd-item-target.target-manager{color:var(--blue)}
  .cmd-item-target.target-developer{color:var(--amber)}
  .cmd-item-target.target-tester{color:var(--teal)}
  .cmd-item-target.target-all{color:var(--purple)}

  /* Sessions */
  .session-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px}
  .session-item:last-child{margin-bottom:0}
  .session-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
  .session-author{font-size:12px;font-weight:600;color:var(--teal)}
  .session-time{font-size:11px;color:var(--text3)}
  .session-preview{font-size:13px;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .logs-link{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--blue);padding:10px;border:1px solid var(--blue-border);border-radius:var(--radius-sm);background:var(--blue-bg)}

  /* Loading / empty states */
  .loading{color:var(--text3);font-size:13px;text-align:center;padding:16px}
  .empty-state{color:var(--text3);font-size:13px;text-align:center;padding:16px;font-style:italic}

  /* Pulse new */
  @keyframes newGlow{0%{background-color:rgba(59,130,246,.2)}100%{background-color:transparent}}
  .new-flash{animation:newGlow 1s ease-out}

  /* Responsive */
  @media(min-width:480px){
    .approval-actions{gap:14px}
    .approve-btn,.reject-btn{font-size:15px;padding:13px}
    .cmd-row{gap:10px}
  }
</style>
</head>
<body>

<!-- Login Gate -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>Scroll<span>ToBid</span></h1>
    <p>Control Panel &mdash; Enter access code</p>
    <label for="passInput">Access code</label>
    <input type="password" id="passInput" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Nikolas" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">Enter</button>
    <div class="login-error" id="loginError">Wrong code. Try again.</div>
  </div>
</div>

<!-- App Content -->
<div class="app-content" id="appContent">

  <div class="header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" class="back-link">&#8592; Tracker</a>
        <div class="header-title">Control <span>Panel</span></div>
      </div>
      <div class="header-right">
        <button class="sound-btn" id="soundBtn" onclick="toggleSound()" title="Toggle sound">&#128276;</button>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
      </div>
    </div>
  </div>

  <div class="main">

    <!-- Section A: Live Alerts -->
    <div class="section" id="alertsSection">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-title">Live Alerts</div>
          <span class="badge-count" id="alertBadge" style="display:none">0</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="mark-all-btn" onclick="markAllRead()">Mark all read</button>
          <button class="collapse-btn" onclick="toggleSection('alertsSection')">&#8963;</button>
        </div>
      </div>
      <div class="section-body" id="alertsBody">
        <div class="loading" id="alertsLoading">Loading alerts&hellip;</div>
      </div>
    </div>

    <!-- Section B: Approval Queue -->
    <div class="section" id="approvalsSection">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-title">Approval Queue</div>
          <span class="badge-count urgent" id="approvalBadge" style="display:none">0</span>
        </div>
        <button class="collapse-btn" onclick="toggleSection('approvalsSection')">&#8963;</button>
      </div>
      <div class="section-body" id="approvalsBody">
        <div class="loading" id="approvalsLoading">Loading approvals&hellip;</div>
      </div>
    </div>

    <!-- Section C: Send Command -->
    <div class="section" id="commandSection">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-title">Send Command</div>
        </div>
        <button class="collapse-btn" onclick="toggleSection('commandSection')">&#8963;</button>
      </div>
      <div class="section-body" id="commandBody">
        <div class="cmd-form">
          <div class="cmd-row">
            <select class="cmd-select" id="cmdTarget">
              <option value="Manager">Manager</option>
              <option value="Developer">Developer</option>
              <option value="Tester">Tester</option>
              <option value="All">All</option>
            </select>
            <input type="text" class="cmd-input" id="cmdInput" placeholder="Type a command&hellip;" onkeydown="if(event.key==='Enter')sendCommand()">
          </div>
          <button class="cmd-send" id="cmdSendBtn" onclick="sendCommand()">&#9658; Send</button>
        </div>
        <div class="cmd-recent" id="cmdRecent"></div>
      </div>
    </div>

    <!-- Section D: Recent Session Logs -->
    <div class="section collapsed" id="sessionsSection">
      <div class="section-header">
        <div class="section-header-left">
          <div class="section-title">Recent Session Logs</div>
        </div>
        <button class="collapse-btn" onclick="toggleSection('sessionsSection')">&#8963;</button>
      </div>
      <div class="section-body" id="sessionsBody">
        <div class="loading" id="sessionsLoading">Loading&hellip;</div>
        <a href="logs.html" class="logs-link">View full logs &rarr;</a>
      </div>
    </div>

  </div>
</div>

<script>
// ── Config ──
var SUPA_URL = "https://dsmprjvgkcmjplmchsrg.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbXByanZna2NtanBsbWNoc3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNzYyMTEsImV4cCI6MjA4ODc1MjIxMX0.EOqNUIAlKJ6ulSgUFfoutQvI93sqhXxn50FGAFan1S0";

// ── Auth ──
var currentUser = "";

function hashPass(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return h;
}

var CORRECT_HASH = hashPass("triole123456");

function tryLogin() {
  var pass = document.getElementById("passInput").value;
  var name = document.getElementById("nameInput").value.trim();
  if (hashPass(pass) === CORRECT_HASH && name) {
    sessionStorage.setItem("stb-auth", "1");
    sessionStorage.setItem("stb-user", name);
    currentUser = name;
    showApp();
  } else if (!name) {
    document.getElementById("loginError").style.display = "block";
    document.getElementById("loginError").textContent = "Please enter your name.";
  } else {
    document.getElementById("loginError").style.display = "block";
    document.getElementById("loginError").textContent = "Wrong code. Try again.";
  }
}

function doLogout() {
  sessionStorage.removeItem("stb-auth");
  sessionStorage.removeItem("stb-user");
  location.reload();
}

function checkAuth() {
  if (sessionStorage.getItem("stb-auth") === "1" && sessionStorage.getItem("stb-user")) {
    currentUser = sessionStorage.getItem("stb-user");
    showApp();
  }
}

function showApp() {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("appContent").style.display = "block";
  initApp();
}

// ── Sound ──
var soundOn = localStorage.getItem("stb-sound") !== "off";

function updateSoundBtn() {
  document.getElementById("soundBtn").textContent = soundOn ? "\uD83D\uDD14" : "\uD83D\uDD15";
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem("stb-sound", soundOn ? "on" : "off");
  updateSoundBtn();
}

// Short beep: 440Hz sine wave encoded as base64 WAV (mono 8000Hz 0.1s)
var BEEP_URI = "data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAGAACAgICAgICAgICAgICAgICAgICAgICA" +
  "f39/f39/fn5+fn19fXx8fHt7e3p6enl5eXh4eHd3d3Z2dnV1dXR0dHNzc3JycnFxcXBwcG9vb25ubm1t" +
  "bWxsbGtra2pqamlpaWhoaGdnZ2ZmZmVlZWRkZGNjY2JiYmFhYWBgYF9fX15eXl1dXVxcXFtbW1paWllZ" +
  "WVhYWFdXV1ZWVlVVVVRUVFNTU1JSUlFRUVBQUE9PT05OTk1NTUxMTEtLS0pKSklJSUhISEdHR0ZGRUUF" +
  "BQUEBAQDAwMCAgIBAQEAAAABAQECAgIDAwMEBAQFBQUGBgYHBwcICAgJCQkKCgoLCwsMDAwNDQ0ODg4P" +
  "Dw8QEBARERESEhITExMUFBQVFRUWFhYXFxcYGBgZGRkaGhobGxscHBwdHR0eHh4fHx8gICAhISEiIiIj" +
  "IyMkJCQlJSUmJiYnJycoKCgpKSkqKiorKyssLCwtLS0uLi4vLy8wMDAxMTEyMjIzMzM0NDQ1NTU2NjY3" +
  "Nzc4ODg5OTk6Ojo7Ozs8PDw9PT0+Pj4/Pz9AQEBBQUFCQkJDQ0NERERFRUVGRkZHR0dISEhJSUlKSkpL" +
  "S0tMTExNTU1OTk5PT09QUFBRUVFSUlJTU1NUVFRVVVVWVlZXV1dYWFhZWVlaWlpbW1tcXFxdXV1eXl5f" +
  "X19gYGBhYWFiYmJjY2NkZGRlZWVmZmZnZ2doaGhpaWlqampra2tsbGxtbW1ubm5vb29wcHBxcXFycnJz" +
  "c3N0dHR1dXV2dnZ3d3d4eHh5eXl6enp7e3t8fHx9fX1+fn5/f39/gICAgICAgICAgICAgICAgICAgICAgA==";

var beepAudio = null;
function playBeep() {
  if (!soundOn) return;
  try {
    if (!beepAudio) { beepAudio = new Audio(BEEP_URI); }
    var a = new Audio(BEEP_URI);
    a.volume = 0.4;
    a.play();
  } catch(e) {}
}

// ── Supabase helper ──
function sbReq(method, path, body, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, SUPA_URL + "/rest/v1/" + path);
  xhr.setRequestHeader("apikey", SUPA_KEY);
  xhr.setRequestHeader("Authorization", "Bearer " + SUPA_KEY);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.setRequestHeader("Prefer", "return=representation");
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch(e) { data = null; }
      callback(xhr.status, data);
    }
  };
  xhr.send(body ? JSON.stringify(body) : null);
}

// ── Section collapse ──
function toggleSection(id) {
  var el = document.getElementById(id);
  if (el.classList.contains("collapsed")) {
    el.classList.remove("collapsed");
  } else {
    el.classList.add("collapsed");
  }
}

// ── Time formatting ──
function fmtTime(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  var now = new Date();
  var diff = (now - d) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  return d.toLocaleDateString("en-GB", {day:"numeric",month:"short"});
}

// ── Section A: Alerts ──
var knownAlertIds = null;
var alertsData = [];

function agentClass(agent) {
  if (!agent) return "agent-all";
  var a = agent.toLowerCase();
  if (a === "manager") return "agent-manager";
  if (a === "developer") return "agent-developer";
  if (a === "tester") return "agent-tester";
  return "agent-all";
}

function unreadClass(agent) {
  if (!agent) return "unread-all";
  var a = agent.toLowerCase();
  if (a === "manager") return "unread-manager";
  if (a === "developer") return "unread-developer";
  if (a === "tester") return "unread-tester";
  return "unread-all";
}

function renderAlerts(rows) {
  var body = document.getElementById("alertsBody");
  var unreadCount = 0;
  for (var i = 0; i < rows.length; i++) { if (!rows[i].read) unreadCount++; }

  var badge = document.getElementById("alertBadge");
  if (unreadCount > 0) {
    badge.style.display = "inline-block";
    badge.textContent = unreadCount;
  } else {
    badge.style.display = "none";
  }

  if (!rows.length) {
    body.innerHTML = "<div class=\"empty-state\">No alerts yet.</div>";
    return;
  }

  var html = "";
  for (var j = 0; j < rows.length; j++) {
    var r = rows[j];
    var uc = unreadClass(r.agent);
    var ac = agentClass(r.agent);
    var cardClass = "alert-card" + ((!r.read) ? " " + uc : "");
    html += "<div class=\"" + cardClass + "\" id=\"alert-" + r.id + "\">";
    html += "<div class=\"alert-top\">";
    html += "<div style=\"display:flex;align-items:center;gap:8px\">";
    if (!r.read) { html += "<span class=\"unread-dot\"></span>"; }
    html += "<span class=\"alert-agent " + ac + "\">" + (r.agent || "All") + "</span>";
    html += "</div>";
    html += "<span class=\"alert-time\">" + fmtTime(r.created_at) + "</span>";
    html += "</div>";
    html += "<div class=\"alert-msg\">" + escHtml(r.message || "") + "</div>";
    html += "</div>";
  }
  body.innerHTML = html;

  // Mark alert as read when tapped
  var cards = body.querySelectorAll(".alert-card");
  for (var k = 0; k < rows.length; k++) {
    (function(row) {
      var el = document.getElementById("alert-" + row.id);
      if (el && !row.read) {
        el.addEventListener("click", function() { markAlertRead(row.id); });
      }
    })(rows[k]);
  }
}

function markAlertRead(id) {
  sbReq("PATCH", "tracker_alerts?id=eq." + id, {read: true}, function(status) {
    if (status >= 200 && status < 300) {
      for (var i = 0; i < alertsData.length; i++) {
        if (alertsData[i].id === id) { alertsData[i].read = true; }
      }
      renderAlerts(alertsData);
    }
  });
}

function markAllRead() {
  var unread = [];
  for (var i = 0; i < alertsData.length; i++) {
    if (!alertsData[i].read) unread.push(alertsData[i].id);
  }
  if (!unread.length) return;
  sbReq("PATCH", "tracker_alerts?read=eq.false", {read: true}, function(status) {
    if (status >= 200 && status < 300) {
      for (var j = 0; j < alertsData.length; j++) { alertsData[j].read = true; }
      renderAlerts(alertsData);
    }
  });
}

function pollAlerts() {
  sbReq("GET", "tracker_alerts?order=created_at.desc&limit=20", null, function(status, data) {
    document.getElementById("alertsLoading") && (document.getElementById("alertsLoading").style.display = "none");
    if (status !== 200 || !Array.isArray(data)) return;
    // Detect new alerts
    if (knownAlertIds !== null) {
      for (var i = 0; i < data.length; i++) {
        var id = data[i].id;
        if (!data[i].read && knownAlertIds.indexOf(id) === -1) {
          playBeep();
          break;
        }
      }
    }
    var newIds = [];
    for (var j = 0; j < data.length; j++) { newIds.push(data[j].id); }
    knownAlertIds = newIds;
    alertsData = data;
    renderAlerts(data);
  });
}

// ── Section B: Approvals ──
var knownPendingIds = null;
var pendingApprovals = [];
var historyApprovals = [];
var historyOpen = false;

function renderApprovals() {
  var body = document.getElementById("approvalsBody");
  var badge = document.getElementById("approvalBadge");

  if (pendingApprovals.length > 0) {
    badge.style.display = "inline-block";
    badge.textContent = pendingApprovals.length;
  } else {
    badge.style.display = "none";
  }

  var html = "";

  if (pendingApprovals.length === 0) {
    html += "<div class=\"empty-state\">No pending approvals.</div>";
  } else {
    for (var i = 0; i < pendingApprovals.length; i++) {
      var r = pendingApprovals[i];
      html += "<div class=\"approval-card\" id=\"approval-" + r.id + "\">";
      html += "<div class=\"approval-question\">" + escHtml(r.question || r.message || "") + "</div>";
      html += "<div class=\"approval-meta\">";
      html += "From: <strong>" + escHtml(r.agent || "Unknown") + "</strong> &middot; " + fmtTime(r.created_at);
      html += "</div>";
      html += "<textarea class=\"approval-note\" id=\"note-" + r.id + "\" placeholder=\"Optional note&hellip;\" rows=\"2\"></textarea>";
      html += "<div class=\"approval-actions\">";
      html += "<button class=\"approve-btn\" onclick=\"respondApproval(" + r.id + ",'approved')\">APPROVE</button>";
      html += "<button class=\"reject-btn\" onclick=\"respondApproval(" + r.id + ",'rejected')\">REJECT</button>";
      html += "</div>";
      html += "</div>";
    }
  }

  // History
  html += "<button class=\"history-toggle" + (historyOpen ? " history-open" : "") + "\" id=\"historyToggleBtn\" onclick=\"toggleHistory()\">";
  html += "<span class=\"chevron-sm\">&#9658;</span> History (" + historyApprovals.length + ")";
  html += "</button>";

  if (historyOpen && historyApprovals.length > 0) {
    html += "<div class=\"history-list\">";
    for (var j = 0; j < historyApprovals.length; j++) {
      var hr = historyApprovals[j];
      html += "<div class=\"history-card status-" + hr.status + "\">";
      html += "<div class=\"history-question\">" + escHtml(hr.question || hr.message || "") + "</div>";
      html += "<div style=\"display:flex;align-items:center;justify-content:space-between\">";
      html += "<span class=\"history-status " + hr.status + "\">" + hr.status.toUpperCase() + "</span>";
      html += "<span class=\"history-note\">" + fmtTime(hr.responded_at || hr.created_at) + "</span>";
      html += "</div>";
      if (hr.response_note) {
        html += "<div class=\"history-note\" style=\"margin-top:4px\">" + escHtml(hr.response_note) + "</div>";
      }
      html += "</div>";
    }
    html += "</div>";
  }

  body.innerHTML = html;
}

function toggleHistory() {
  historyOpen = !historyOpen;
  renderApprovals();
}

function respondApproval(id, decision) {
  var note = document.getElementById("note-" + id);
  var noteVal = note ? note.value.trim() : "";
  var payload = {
    status: decision,
    response_note: noteVal || null,
    responded_at: new Date().toISOString()
  };
  sbReq("PATCH", "tracker_approvals?id=eq." + id, payload, function(status) {
    if (status >= 200 && status < 300) {
      // Move from pending to history locally
      for (var i = 0; i < pendingApprovals.length; i++) {
        if (pendingApprovals[i].id === id) {
          var moved = pendingApprovals.splice(i, 1)[0];
          moved.status = decision;
          moved.response_note = noteVal || null;
          moved.responded_at = payload.responded_at;
          historyApprovals.unshift(moved);
          break;
        }
      }
      renderApprovals();
    }
  });
}

function pollApprovals() {
  // Pending
  sbReq("GET", "tracker_approvals?status=eq.pending&order=created_at.asc", null, function(status, data) {
    document.getElementById("approvalsLoading") && (document.getElementById("approvalsLoading").style.display = "none");
    if (status !== 200 || !Array.isArray(data)) return;
    // Sound on new pending
    if (knownPendingIds !== null) {
      for (var i = 0; i < data.length; i++) {
        if (knownPendingIds.indexOf(data[i].id) === -1) {
          playBeep();
          break;
        }
      }
    }
    var newIds = [];
    for (var j = 0; j < data.length; j++) { newIds.push(data[j].id); }
    knownPendingIds = newIds;
    pendingApprovals = data;
    renderApprovals();
  });
  // History
  sbReq("GET", "tracker_approvals?status=neq.pending&order=responded_at.desc&limit=20", null, function(status, data) {
    if (status !== 200 || !Array.isArray(data)) return;
    historyApprovals = data;
    renderApprovals();
  });
}

// ── Section C: Commands ──
var recentCommands = [];

function targetClass(target) {
  if (!target) return "target-all";
  var t = target.toLowerCase();
  if (t === "manager") return "target-manager";
  if (t === "developer") return "target-developer";
  if (t === "tester") return "target-tester";
  return "target-all";
}

function renderRecentCommands() {
  var el = document.getElementById("cmdRecent");
  if (!recentCommands.length) { el.innerHTML = ""; return; }
  var html = "";
  for (var i = 0; i < recentCommands.length; i++) {
    var c = recentCommands[i];
    html += "<div class=\"cmd-item\">";
    html += "<div class=\"cmd-item-text\">" + escHtml(c.command || c.message || "") + "</div>";
    html += "<div class=\"cmd-item-meta\">";
    html += "<div class=\"cmd-item-target " + targetClass(c.target) + "\">" + escHtml(c.target || "All") + "</div>";
    html += "<div>" + fmtTime(c.created_at) + "</div>";
    html += "</div>";
    html += "</div>";
  }
  el.innerHTML = html;
}

function sendCommand() {
  var input = document.getElementById("cmdInput");
  var target = document.getElementById("cmdTarget").value;
  var text = input.value.trim();
  if (!text) return;
  var btn = document.getElementById("cmdSendBtn");
  btn.disabled = true;
  btn.textContent = "Sending\u2026";
  var payload = {
    message: text,
    target: target,
    from_user: currentUser
  };
  sbReq("POST", "tracker_commands", payload, function(status, data) {
    btn.disabled = false;
    btn.innerHTML = "&#9658; Send";
    if (status >= 200 && status < 300) {
      input.value = "";
      pollCommands();
    }
  });
}

function pollCommands() {
  sbReq("GET", "tracker_commands?order=created_at.desc&limit=5", null, function(status, data) {
    if (status !== 200 || !Array.isArray(data)) return;
    recentCommands = data;
    renderRecentCommands();
  });
}

// ── Section D: Sessions ──
function renderSessions(rows) {
  var body = document.getElementById("sessionsBody");
  var html = "";
  if (!rows.length) {
    html += "<div class=\"empty-state\">No session logs yet.</div>";
  } else {
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += "<div class=\"session-item\">";
      html += "<div class=\"session-top\">";
      html += "<span class=\"session-author\">" + escHtml(r.author || "Unknown") + "</span>";
      html += "<span class=\"session-time\">" + fmtTime(r.created_at) + "</span>";
      html += "</div>";
      var summary = r.summary || r.body || r.content || "";
      html += "<div class=\"session-preview\">" + escHtml(summary) + "</div>";
      html += "</div>";
    }
  }
  html += "<a href=\"logs.html\" class=\"logs-link\">View full logs &rarr;</a>";
  body.innerHTML = html;
}

function pollSessions() {
  sbReq("GET", "tracker_sessions?order=created_at.desc&limit=10", null, function(status, data) {
    document.getElementById("sessionsLoading") && (document.getElementById("sessionsLoading").style.display = "none");
    if (status !== 200 || !Array.isArray(data)) return;
    renderSessions(data);
  });
}

// ── Utility ──
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ── Init & polling ──
var pollInterval = null;

function pollAll() {
  pollAlerts();
  pollApprovals();
  pollCommands();
  pollSessions();
}

function initApp() {
  updateSoundBtn();
  pollAll();
  pollInterval = setInterval(pollAll, 3000);
}

// Start
checkAuth();
</script>
</body>
</html>
